name: Contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill graph
        run: python3 scripts/validate_contracts.py
      - name: Check Python syntax
        run: python3 -m compileall -q scripts skills/project-management-rpm
      - name: Run contract and adapter tests
        run: python3 -m unittest discover -s tests -v
